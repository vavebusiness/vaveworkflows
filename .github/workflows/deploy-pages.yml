name: Deploy Vave Workflow HQ Preview
on:
  push:
    branches: [public-preview]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout sanitized branch
        uses: actions/checkout@v6
        with:
          ref: public-preview
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload sanitized static HQ
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
